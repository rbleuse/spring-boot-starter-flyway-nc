name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'rbleuse/spring-boot-starter-flyway-nc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 25.0.4
      - name: Verify release version
        shell: bash
        run: |
          version="$(./gradlew properties --property version --quiet | sed 's/^version: //')"
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Build and test
        run: ./gradlew build
      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
